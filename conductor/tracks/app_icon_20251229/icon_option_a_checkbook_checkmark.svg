<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="#EFF1F5"/>

  <!-- Subtle inner panel for depth -->
  <rect x="160" y="176" width="704" height="672" rx="180" fill="#E6E9EF"/>

  <!-- Checkbook body -->
  <rect x="192" y="256" width="640" height="448" rx="96" stroke="#4C4F69" stroke-width="32" fill="none"/>

  <!-- Checkbook spine strip -->
  <rect x="224" y="288" width="80" height="384" rx="40" fill="#DCE0E8"/>
  <line x1="256" y1="304" x2="256" y2="656" stroke="#4C4F69" stroke-width="16" stroke-linecap="round"/>

  <!-- Baseline inside the checkbook (ledger hint) -->
  <line x1="304" y1="560" x2="784" y2="560" stroke="#9CA0B0" stroke-width="16" stroke-linecap="round"/>

  <!-- Checkmark -->
  <path d="M368 480 L464 576 L720 384" stroke="#40A02B" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Soft highlight at top -->
  <rect x="208" y="272" width="608" height="80" rx="40" fill="url(#gradHighlight)" opacity="0.45"/>

  <defs>
    <linearGradient id="gradHighlight" x1="208" y1="272" x2="816" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#E6E9EF" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
